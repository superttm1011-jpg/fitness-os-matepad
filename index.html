async function dbRead(){return await new Promise((resolve,reject)=>{const tx=db.transaction('data','readonly'),r=tx.objectStore('data').get(DBKEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbWrite(value){return await new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(value,DBKEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function validRoot(o){return o&&typeof o==='object'&&o.profiles&&o.profiles.him&&o.profiles.her&&Array.isArray(o.profiles.him.workouts)&&Array.isArray(o.profiles.her.workouts)}
function migrateLegacy(s){const p=makeProfile('him');if(Array.isArray(s.workouts))p.workouts=s.workouts.map(w=>({...w,id:w.id||rid(),dayIndex:w.day??0,mode:'legacy'}));if(Array.isArray(s.health))p.health.push(...s.health.map(h=>({...h,bpS:num(String(h.bp||'').split('/')[0]),bpD:num(String(h.bp||'').split('/')[1])})));if(Array.isArray(s.meals))p.meals=s.meals.map(m=>({...m,carbs:num(m.carbs,0),fat:num(m.fat,0)}));p.cycle=num(s.cycle,0);p.phase=s.phase||'adapt';p.targets={...p.targets,kcal:num(s.dailyKcal,2000),protein:num(s.dailyProtein,110)};p.draft=null;root.profiles.him=p;root.hasLegacy=true}
async function boot(){try{db=await openDB();let prev=await dbRead();if(!validRoot(prev)){prev=await readPreviousVersion()}if(validRoot(prev)){root=prev}else{const x=localStorage.getItem('FitnessOS_Duo_V4_fallback');if(x){try{let o=JSON.parse(x);if(validRoot(o))root=o}catch{}}if(!validRoot(root))root=makeRoot();if(!prev){try{let legacy=JSON.parse(localStorage.getItem(LEGACY));if(legacy&&Array.isArray(legacy.workouts))migrateLegacy(legacy)}catch{}}}lastSaveStatus='IndexedDB 本地存储'}catch(err){db=null;try{let o=JSON.parse(localStorage.getItem('FitnessOS_Duo_V4_fallback'));if(validRoot(o))root=o}catch{}lastSaveStatus='浏览器备用存储'}for(const id of ['him','her']){let p=root.profiles[id];p.customExercises=p.customExercises||[];p.foodProducts=p.foodProducts||[];p.hiddenEx=p.hiddenEx||[];p.setOverrides=p.setOverrides||{};if(id==='her')p.pregnancyStatus=p.pregnancyStatus||'planning'}root.version=4;root.active=['him','her'].includes(root.active)?root.active:'him';root.view=NAV.some(x=>x[0]===root.view)?root.view:'home';booted=true;render();save();}
function save(){const snapshot=structuredClone(root);persistQueue=persistQueue.then(async()=>{if(db)await dbWrite(snapshot);else localStorage.setItem('FitnessOS_Duo_V4_fallback',JSON.stringify(snapshot));lastSaveStatus=db?'IndexedDB 已保存':'备用存储已保存'}).catch(e=>{lastSaveStatus='保存失败：请立即导出备份';console.error(e);tip('保存出现异常，请导出备份！')});return persistQueue}
function switchProfile(who){if(!root.profiles[who])return;root.active=who;root.view='home';healthMetric='weight';labMetric=who==='him'?'alt':'glucose';root.timer={seconds:90,endAt:null,running:false};save();render();window.scrollTo({top:0,behavior:'smooth'});tip('已切换至'+pr().name+'的独立档案')}
function route(v){$('modal-root').innerHTML='';root.view=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function nav(){const make=(mobile=false)=>{let choices=mobile?NAV.filter(x=>['home','train','guide','food'].includes(x[0])):NAV;return choices.map(([id,ic,label])=>`<button type="button" data-route="${id}" class="${root.view===id?'on':''}" aria-current="${root.view===id?'page':'false'}">${iconSVG(ic)}<span>${label}</span></button>`).join('')+(mobile?`<button type="button" data-action="more-menu" class="${['health','report','settings'].includes(root.view)?'on':''}" aria-label="更多功能：健康、复盘、设置">${iconSVG('more')}<span>更多</span></button>`:'')};$('side-nav').innerHTML=make();$('bottom-nav').innerHTML=make(true);$('profile-switch').innerHTML=[['him','我','本人'],['her','她','爱人']].map(([id,mark,label])=>`<button type="button" data-profile="${id}" class="${id===root.active?'on':''}" aria-pressed="${id===root.active}"><i aria-hidden="true">${mark}</i><span>${label}</span></button>`).join('');document.documentElement.dataset.person=root.active;document.documentElement.style.setProperty('--accent',root.active==='her'?'#b45683':'#285fd5');document.documentElement.style.setProperty('--accentwash',root.active==='her'?'#fff0f7':'#eaf2ff');const t=NAV.find(x=>x[0]===root.view);$('top-title').textContent=t[2]+(root.view==='home'?' · '+pr().name:'')}
function cardStat(label,value,desc,emoji='◉'){return `<div class="card kpi"><span class="muted tiny">${emoji} ${esc(label)}</span><div class="metric">${esc(value)}</div><div class="muted micro">${esc(desc)}</div></div>`}
function lastMetric(p,k){const a=[...p.health].filter(x=>num(x[k])!==null).sort((a,b)=>a.date.localeCompare(b.date));return a.at(-1)?.[k]??null}
function getDaySeries(){const p=pr();return [...p.health].sort((a,b)=>a.date.localeCompare(b.date))}
function sevenAvg(series,key){const from=new Date();from.setDate(from.getDate()-6);const fromKey=[from.getFullYear(),String(from.getMonth()+1).padStart(2,'0'),String(from.getDate()).padStart(2,'0')].join('-');const end=today();const s=series.filter(x=>num(x[key])!==null&&x.date>=fromKey&&x.date<=end).sort((a,b)=>a.date.localeCompare(b.date));return s.length?s.reduce((a,b)=>a+num(b[key],0),0)/s.length:null}
function programFor(key){const p=pr();const hidden=p.hiddenEx||[];const overrides=p.setOverrides||{};return [...(P[key]||[]),...(p.customExercises||[]).filter(x=>x.cat===key)].filter(e=>!hidden.includes(e.id)).map(e=>({...e,sets:num(overrides[e.id],e.sets)}))}
function recoveryStatus(){const r=pr().recovery.filter(x=>x.date===today()).at(-1);if(!r)return null;return {r,score:(num(r.energy,3)+6-num(r.soreness,3)+num(r.mood,3))/3}}
function readinessText(){const q=recoveryStatus();return !q?'未填写当日恢复情况':q.r.pain==='yes'?'自评疼痛/不适：暂停或减量并评估':q.score<2.5?'恢复偏差：减重或换轻活动':q.score<3.5?'一般：建议保留较多余力':'状态尚可：依计划渐进'}
function homepage(){const p=pr(), d=day(),series=getDaySeries(),lastW=lastMetric(p,'weight'),avg=sevenAvg(series,'weight'),hits=p.workouts.filter(w=>w.date>=windowWeekStart()).length, lastLab=[...p.labs].sort((a,b)=>a.date.localeCompare(b.date)).at(-1);return `<div class="hero"><div><span class="pill" style="background:#ffffff25;color:#e7f4ff">${root.active==='him'?'练3休1 · 三分化':'每周2–3次全身训练 · 低强度起步'}</span><h2>${p.name}的下一次：${esc(d[0])}</h2><p>${esc(d[1])}。${p.phase==='adapt'?'当前为重新适应期：先找动作感觉、保留4–5次余力。':'当前为正式期：以动作质量和恢复情况为优先。'}</p><div class="buttons"><button class="btn" data-route="train">开始今日训练</button><button class="btn secondary" data-route="health">记录身体指标</button></div></div><div class="emblem" aria-hidden="true">${iconSVG(root.active==='him'?'dumbbell':'heart')}</div></div>
${(!root.lastBackupAt||(Date.now()-new Date(root.lastBackupAt).getTime())>7*86400000)?'<div class="notice info" style="margin-top:14px">💾 双人备份提醒：建议至少每周导出一次完整JSON，避免平板清除网站数据后丢失长期记录。<button class="btn slim secondary" data-action="export" style="margin-left:10px">立即备份</button></div>':''}<div class="title-row"><h2>个人趋势</h2><span class="pill">${lastSaveStatus}</span></div><div class="grid four">${cardStat('最近体重',fmt(lastW)+' kg','基线 '+p.weightRef+' kg','⚖')}${cardStat('近7天有效记录均重',fmt(avg)+' kg','仅基于近7天已记录的数据','📈')}${cardStat('本周训练记录',hits+' 次','含快走与恢复记录','◉')}${cardStat('训练准备度',recoveryStatus()?fmt(recoveryStatus().score,1)+'/5':'待填写',readinessText(),'💤')}</div>
<div class="title-row"><h2>训练轮转</h2><button class="btn slim secondary" data-route="train">进入详细动作</button></div>${dayButtons()}
<div class="grid two" style="margin-top:14px"><div class="card"><h2>今日执行清单</h2><div class="stack"><div class="listrow"><span>✓ 训练或完成恢复日计划</span><span class="pill">${esc(d[0])}</span></div><div class="listrow"><span>✓ 蛋白质与蔬菜摄入</span><span class="pill">${p.targets.protein} g/天参考</span></div><div class="listrow"><span>✓ 日常步数</span><span class="pill">${p.targets.steps}步目标</span></div><div class="listrow"><span>✓ 记录恢复评分</span><button class="btn slim ghost" data-route="train">去填写</button></div></div></div><div class="card"><h2>医学背景提醒</h2>${root.active==='him'?'<div class="notice">若有肝功能、血脂或其他化验异常，请按医生建议复查，不能仅凭运动量判断已恢复。</div>':'<div class="notice">备孕期间如有高血糖等异常，请先完成医生评估；训练采用保守起始强度。</div>'}<p class="muted tiny">最近指标记录：${esc(lastLab?.date||'暂无')}。生理数据对比用于趋势查看，不用于自动诊断。</p></div></div>`}
function windowWeekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayButtons(){return `<div class="daygrid ${root.active==='her'?'her':''}">${days().map((d,i)=>`<button class="day ${pr().cycle===i?'on':''}" data-day="${i}"><small>D${i+1}</small><strong>${esc(d[0])}</strong><small>${esc(d[1])}</small></button>`).join('')}</div>`}
function draft(){const p=pr();if(!p.draft||p.draft.dayIndex!==p.cycle){p.draft={id:rid(),dayIndex:p.cycle,started:new Date().toISOString(),sets:{}};save()}return p.draft}
function setsFor(e){const d=draft(),count=pr().phase==='adapt'?Math.min(2,e.sets):e.sets;return Array.from({length:count},(_,i)=>({...{weight:'',reps:'',rpe:'',done:false},...(d.sets[e.id]?.[i]||{})}))}
function lastEx(eid){return [...pr().workouts].reverse().flatMap(w=>w.sets||[]).find(e=>e.id===eid)||null}
function guidance(e){const last=lastEx(e.id),rows=last?.rows?.filter(r=>r.done)||[];if(!rows.length)return {text:'首次训练：从轻重量开始，先建立规范动作及RPE记录。',type:'info'};const vals=rows.map(r=>num(r.weight)).filter(x=>x!==null),rpes=rows.map(r=>num(r.rpe)).filter(x=>x!==null),reps=rows.map(r=>num(r.reps)).filter(x=>x!==null);const w=vals.at(-1)??0;const maxRpe=rpes.length?Math.max(...rpes):null;const q=recoveryStatus();if(q&&q.r.pain==='yes')return {text:'今日自评有明显疼痛/不适：暂停该动作，必要时寻求专业评估。',type:'warn'};if(q&&q.score<2.5)return {text:'今天恢复分偏低：建议减量约5–10%或改为轻活动，不强行加重。',type:'warn'};if(maxRpe!==null&&maxRpe>=9)return{text:`上次最高RPE ${maxRpe}，继续维持或适当减轻重量，优先恢复动作质量。`,type:'warn'};if(reps.length===rows.length&&reps.every(v=>v>=e.hi)&&maxRpe!==null&&maxRpe<=8&&w>0)return{text:`上次全部达到${e.hi}次且RPE≤8；可小幅加重（史密斯/奥杆约2–2.5kg，绳索按最小档）并观察动作。`,type:'good'};if(reps.some(v=>v<e.lo))return{text:`上次有组未达到最低${e.lo}次，先稳住动作，可维持或小幅降重。`,type:'warn'};return {text:`上次参考：${w>0?w+'kg':'自重'}；本次优先维持，逐步让每组次数达到目标上限。`,type:'info'}}
function poseSvg(kind){const shapes={bench:[['line',15,70,87,70],['line',25,75,25,88],['line',73,75,73,88],['line',31,52,64,52],['line',38,53,24,44],['line',57,53,75,44],['line',24,44,24,26],['line',75,44,75,26],['line',17,26,83,26]],squat:[['line',28,18,70,18],['line',48,36,48,51],['line',48,51,32,66],['line',48,51,65,66],['line',32,66,24,88],['line',65,66,80,88]],row:[['line',58,30,42,55],['line',42,55,67,60],['line',67,60,72,82],['line',42,55,23,82],['line',58,30,80,45],['line',80,45,87,43]],pulldown:[['line',22,12,78,12],['line',50,34,50,61],['line',50,61,33,85],['line',50,61,67,85],['line',50,40,28,23],['line',50,40,72,23]],hinge:[['line',29,37,55,53],['line',55,53,65,75],['line',55,53,39,75],['line',29,37,38,17],['line',29,37,18,53]],bridge:[['line',15,71,80,71],['line',25,60,42,42],['line',42,42,66,42],['line',66,42,76,65],['line',25,60,18,84]],plank:[['line',15,68,80,68],['line',21,58,35,50],['line',35,50,69,50],['line',69,50,78,65],['line',21,58,18,78]],press:[['line',49,30,49,63],['line',49,63,33,87],['line',49,63,65,87],['line',49,40,29,18],['line',49,40,69,18],['line',20,17,78,17]],fly:[['line',49,32,49,65],['line',49,65,33,86],['line',49,65,65,86],['line',49,43,18,51],['line',49,43,80,51]],cable:[['line',49,32,49,65],['line',49,65,35,85],['line',49,65,65,85],['line',49,40,65,54],['line',65,54,65,75],['line',75,8,75,83]],lunge:[['line',49,25,49,53],['line',49,53,30,66],['line',49,53,72,70],['line',30,66,17,85],['line',72,70,84,70]]};let ls=shapes[kind]||shapes.squat;return `<svg viewBox="0 0 100 100" role="img" aria-label="简化动作示意，不代替真人教学" style="max-width:92px;width:100%"><circle cx="49" cy="${['bench','bridge','plank','hinge'].includes(kind)?(kind==='bench'?43:kind==='plank'?48:kind==='bridge'?59:29):21}" r="7" fill="#2674d7" opacity=".9"/>${ls.map(x=>`<line x1="${x[1]}" y1="${x[2]}" x2="${x[3]}" y2="${x[4]}" stroke="#2362af" stroke-width="4" stroke-linecap="round"/>`).join('')}<path d="M85 16 l6 5 -6 5" fill="none" stroke="#4ab2a3" stroke-width="2.5" / function exerciseCard(e,i){const rows=setsFor(e),g=guidance(e),prev=lastEx(e.id),best=prev?.rows?.filter(x=>x.done).at(-1);return `<article class="ex"><div class="exhead"><div class="row between"><span class="exname">${i+1}. ${esc(e.name)}</span><span class="pill">${rows.length}组 × ${esc(e.reps)}</span></div><div class="muted tiny">${esc(e.muscle)} · ${esc(e.equip)}</div><button type="button" class="btn slim secondary detail-cta" data-exdetail="${esc(e.id)}">动作分解与安全检查 →</button></div><div class="exbody"><div class="pose">${poseSvg(e.pose)}</div><div class="exguides"><strong>动作要领：</strong>${esc(e.how)}<br><span class="warn"><strong>常见错误：</strong>${esc(e.mistake)}</span>${e.alt?`<br><strong>替代动作：</strong>${esc(e.alt)}`:''}<div class="micro muted">※ 简化示意，仅用于辨认动作类型，首次练习请用空杆并对照器械说明。</div></div></div><div class="exfooter"><div class="notice ${g.type==='good'?'green':g.type==='warn'?'':'info'}">智能负重建议：${esc(g.text)}${best?`<br>上次完成：${esc(best.weight||'自重')} kg × ${esc(best.reps||'—')} 次，RPE ${esc(best.rpe||'—')}`:''}</div><table class="settable"><thead><tr><th>组</th><th>重量(kg)</th><th>次数/秒</th><th>RPE</th><th>完成</th></tr></thead><tbody>${rows.map((r,j)=>`<tr><td>${j+1}</td><td><input aria-label="${esc(e.name)}第${j+1}组重量" inputmode="decimal" type="number" min="0" max="500" step="0.5" data-ex="${e.id}" data-row="${j}" data-field="weight" value="${esc(r.weight)}"></td><td><input aria-label="${esc(e.name)}第${j+1}组次数" type="number" min="0" max="600" step="1" data-ex="${e.id}" data-row="${j}" data-field="reps" value="${esc(r.reps)}"></td><td><input aria-label="${esc(e.name)}第${j+1}组RPE" type="number" min="1" max="10" step="0.5" data-ex="${e.id}" data-row="${j}" data-field="rpe" value="${esc(r.rpe)}"></td><td><input type="checkbox" aria-label="${esc(e.name)}第${j+1}组完成" data-ex="${e.id}" data-row="${j}" data-field="done" ${r.done?'checked':''}></td></tr>`).join('')}</tbody></table><div class="row between"><span class="micro muted">组间休息：${e.rest}秒 · ${rows.filter(r=>r.done).length} function recoveryForm(){const x=pr().recovery.find(x=>x.date===today());return `<div class="card"><h2>今日恢复与疲劳评估</h2><p class="section-sub">评分仅调整训练建议，不作医学诊断。精神、睡眠不足或不适时降低训练强度。</p><form id="recovery-form" class="formline"><div class="field"><label>精力（1差–5好）</label><select name="energy">${[1,2,3,4,5].map(v=>`<option value="${v}" ${num(x?.energy,3)===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>肌肉酸痛（1轻–5重）</label><select name="soreness">${[1,2,3,4,5].map(v=>`<option value="${v}" ${num(x?.soreness,2)===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>心情（1差–5好）</label><select name="mood">${[1,2,3,4,5].map(v=>`<option value="${v}" ${num(x?.mood,3)===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>睡眠（小时）</label><input name="sleep" type="number" min="0" max="18" step="0.5" value="${esc(x?.sleep??'')}"></div><div class="field"><label>疼痛或不适</label><select name="pain"><option value="no" ${x?.pain!=='yes'?'selected':''}>无明显不适</option><option value="yes" ${x?.pain==='yes'?'selected':''}>有，需要减量/停止</option></select></div><div class="field" style="justify-content:flex-end"><button class="btn" type="submit">保存恢复评分</button></div></form><div class="muted tiny" style="margin-top:9px">当前建议：${readinessText()}</div></div>`}
function training(){const p=pr(),d=day(),rest=['walk','rest'].includes(d[2]),phase=p.phase==='adapt'?'适应期':'正式期';let html=`<div class="grid two"><div class="card"><div class="row between"><div><h2>${esc(d[0])} · ${esc(d[1])}</h2><span class="pill">${phase}</span></div><div class="buttons"><button data-phase="adapt" class="btn slim ${p.phase==='adapt'?'':'ghost'}">适应期</button><button data-phase="build" class="btn slim ${p.phase==='build'?'':'ghost'}">正式期</button></div></div><p class="muted tiny">${root.active==='him'?'第1–2周：每动作1–2组、RPE 5–6；稳定后3周起逐步恢复40分钟力量＋20分钟爬坡。':'初期每周2次全身力量，第三次可选，非连续日训练；饭后轻松走10–15分钟，逐步累积每周150分钟有氧。'} </p></div>${recoveryForm()}</div><div class="title-row"><h2>选择轮转日</h2><span class="muted tiny">切换只改变当前方案，不会覆盖历史</span></div>${dayButtons()}`;

function mealSum(date=today()){return pr().meals.filter(x=>x.date===date).reduce((s,x)=>({kcal:s.kcal+num(x.kcal,0),protein:s.protein+num(x.protein,0),carbs:s.carbs+num(x.carbs,0),fat:s.fat+num(x.fat,0)}),{kcal:0,protein:0,carbs:0,fat:0})}

function pointsSVG(rows,key){const items=rows.filter(x=>num(x[key])!==null).sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);if(!items.length)return '<div class="empty">尚无这一项目的可绘制数据</div>';let vs=items.map(x=>num(x[key])),min=Math.min(...vs),max=Math.max(...vs);if(min===max){min-=1;max+=1}else{const m=(max-min)*.18;min-=m;max+=m}let coords=items.map((x,i)=>({x:42+i*600/Math.max(items.length-1,1),y:180-(num(x[key])-min)/(max-min)*135,date:x.date,val:x[key]}));let path=coords.map((x,i)=>(i?'L':'M')+x.x.toFixed(1)+','+x.y.toFixed(1)).join(' ');return `<div class="chart"><svg viewBox="0 0 685 215" role="img" aria-label="${esc(key)}趋势"><line x1="42" y1="25" x2="42" y2="180" stroke="#d5e2f0"/><line x1="42" y1="180" x2="650" y2="180" stroke="#d5e2f0"/><path d="${path}" fill="none" stroke="${root.active==='her'?'#b45683':'#2d7cd8'}" stroke-width="3.5"/>${coords.map(x=>`<circle cx="${x.x}" cy="${x.y}" r="4.8" fill="white" stroke="${root.active==='her'?'#b45683':'#2d7cd8'}" stroke-width="3"><title>${x.date}: ${x.val}</title></circle>`).join('')}<text x="5" y="30" fill="#7890a6" font-size="12">${max.toFixed(1)}</text><text x="5" y="180" fill="#7890a6" font-size="12">${min.toFixed(1)}</text><text x="45" y="204" fill="#7890a6" font-size="12">${esc(items[0].date)}</text><text x="535" y="204" fill="#7890a6" font-size="12">${esc(items.at(-1).date)}</text></svg></div>`}

function calendar(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),max=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7;let b=['一','二','三','四','五','六','日'].map(x=>`<div class="calhead">${x}</div>`).join('');for(let i=0;i<off;i++)b+='<div></div>';for(let d=1;d<=max;d++){let ds=[y,String(m+1).padStart(2,'0'),String(d).padStart(2,'0')].join('-'),a=pr().workouts.filter(x=>x.date===ds);b+=`<div class="calcell ${a.length?'done':''} ${ds===today()?'today':''}"><strong>${d}</strong><br>${a.map(w=>esc(days()[w.dayIndex]?.[0]||'训练')).join('、')||'·'}</div>`}return `<div class="calendar">${b}</div>`}

if(id==='food-form'){let f=FOOD[num(get('food'),0)],g=num(get('grams'),100),m=g/100;if(g<1||g>3000)return tip('克数需在1–3000克之间');p.meals.push({id:rid(),date:get('date'),type:get('type'),name:`${f[0]} ${g}g`,kcal:+(f[1]*m).toFixed(1),protein:+(f[2]*m).toFixed(1),carbs:+(f[3]*m).toFixed(1),fat:+(f[4]*m).toFixed(1),estimated:true});save();render();tip('已按常见食物估值记录');return}
if(id==='meal-form'){p.meals.push({id:rid(),date:get('date'),type:get('type'),name:get('name').slice(0,80),kcal:num(get('kcal'),0),protein:num(get('protein'),0),carbs:num(get('carbs'),0),fat:num(get('fat'),0)});save();render();tip('餐食已保存')}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-profile],[data-route],[data-day],[data-phase],[data-action],[data-rest],[data-poster],[data-delete],[data-toggle-ex],[data-custom-del],[data-exdetail],[data-library-add],[data-product-add],[data-product-del]');if(!el){if(e.target?.matches('[data-modal-close]'))$('modal-root').innerHTML='';return}if(el.dataset.libraryAdd)return addFromLibrary(el.dataset.libraryAdd);if(el.dataset.productAdd)return addFromProduct(el.dataset.productAdd);if(el.dataset.productDel)return removeProduct(el.dataset.productDel);if(el.dataset.profile)return switchProfile(el.dataset.profile);if(el.dataset.route)return route(el.dataset.route);if(el.dataset.day!==undefined){pr().cycle=+el.dataset.day;pr().draft=null;save();render();return}if(el.dataset.phase){pr().phase=el.dataset.phase;pr().draft=null;save();render();return}if(el.dataset.rest){root.timer={seconds:+el.dataset.rest,endAt:null,running:false};save();renderTimer();return}if(el.dataset.poster)return posterModal(el.dataset.poster);if(el.dataset.exdetail)return showExerciseDetail(el.dataset.exdetail);if(el.dataset.toggleEx){const id=el.dataset.toggleEx,p=pr();p.hiddenEx=p.hiddenEx||[];p.hiddenEx=p.hiddenEx.includes(id)?p.hiddenEx.filter(x=>x!==id):[...p.hiddenEx,id];p.draft=null;save();render();return}if(el.dataset.customDel){const id=el.dataset.customDel,p=pr();if(!confirm('移除自定义动作？历史训练记录仍保留。'))return;p.customExercises=(p.customExercises||[]).filter(x=>x.id!==id);p.draft=null;save();render();return}if(el.dataset.delete){let [kind,id]=el.dataset.delete.split(':');return del(kind,id)}if(el.dataset.action==='close-modal'){$('modal-root').innerHTML='';return}if(el.dataset.action)return handleAction(el.dataset.action)});
document.addEventListener('change',e=>{let el=e.target;if(el.matches('[data-ex]'))return doSet(el);if(el.id==='body-metric'){healthMetric=el.value;render()}if(el.id==='lab-metric'){labMetric=el.value;render()}if(el.id==='custom-day-choice'){const node=$('exercise-manager');if(node)node.innerHTML=exerciseManager(el.value)}if(el.matches('[data-sets-ex]')){const p=pr();p.setOverrides=p.setOverrides||{};p.setOverrides[el.dataset.setsEx]=Math.max(1,Math.min(6,num(el.value,2)));p.draft=null;save();tip('组数设置已保存，下次训练生效')}if(el.id==='guide-category'){guideFocus=el.value;render()}if(el.id==='guide-query'){guideQuery=el.value;render()}});

function iconSVG(name){const lines={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/>',dumbbell:'<path d="m6.5 6.5 11 11M4 9l5-5M2 7l5-5M15 20l5-5M17 22l5-5M9 4l11 11"/>',book:'<path d="M12 7v14M3 5c3-1 6-1 9 2 3-3 6-3 9-2v14c-3-1-6-1-9 2-3-3-6-3-9-2z"/>',utensils:'<path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M18 21V3c-4 3-4 8 0 10"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',chart:'<path d="M4 20V11M10 20V5M16 20v-8M22 20H2"/>',settings:'<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM12 2l1.5 2.4 2.8-.1 1 2.6 2.5 1.3-.6 2.8 1.8 2.1-1.8 2.2.6 2.8-2.5 1.3-1 2.5-2.8-.1L12 24l-1.5-2.4-2.8.1-1-2.5-2.5-1.3.6-2.8L3 13l1.8-2.1-.6-2.8 2.5-1.3 1-2.6 2.8.1z"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};return `<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${lines[name]||lines.home}</svg>`}
async function readPreviousVersion(){try{let d=await new Promise((res,rej)=>{let r=indexedDB.open('FitnessOS_Duo_V3');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(!d.objectStoreNames.contains('data')){d.close();throw new Error('V3 database empty')}let v=await new Promise((res,rej)=>{let r=d.transaction('data','readonly').objectStore('data').get('family');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});d.close();return validRoot(v)?v:null}catch(e){console.warn('No prior IndexedDB data',e);try{let q=JSON.parse(localStorage.getItem('FitnessOS_Duo_V3_fallback'));return validRoot(q)?q:null}catch{return null}}}

};
function detailFor(e){let a=EX_DETAIL[e.id];if(a)return a;return ['调整器械和座椅至舒适且稳定的位置','选择能保持规范动作的轻重量，准备时自然呼吸',`执行动作：${e.how}`,'控制离心阶段，感到疼痛时停止并调整动作'];}
function showExerciseDetail(id){const e=Object.values(P).flat().find(x=>x.id===id)||(pr().customExercises||[]).find(x=>x.id===id);if(!e)return;const steps=detailFor(e);openModal(`<div class="detail-dialog"><div class="detail-kicker">动作安全指导 · ${esc(e.muscle)}</div><h2>${esc(e.name)}</h2><p class="muted">${esc(e.equip)} · 预设${e.sets}组，每组${esc(e.reps)}</p><div class="detail-hero">${poseSvg(e.pose)}<div><strong>训练前检查</strong><p>器械锁扣/限位、坐凳稳定、脚下防滑、负重可控；首次训练从低负重开始。</p></div></div><h3>动作分解</h3><ol class="step-list">${steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><div class="notice"><strong>避免：</strong>${esc(e.mistake)}</div>${e.alt?`<p><strong>替代动作：</strong>${esc(e.alt)}</p>`:''}<p class="disclaimer">此教学为简化文字示意，不是实拍逐帧动作分析。存在疼痛、眩晕、胸闷、明显不适时停止训练；需要时由合格教练现场检查动作。</p><button class="btn secondary" data-action="close-modal">理解，返回训练</button></div>`);}

// V4.1 independently curated home-gym exercise library (18 additional movements).
function librarySection(){const current=(pr().customExercises||[]);const choices=days().filter(x=>P[x[2]]);return `<div class="card" style="margin-top:16px"><div class="row between"><div><h2>精选扩展动作库</h2><p class="section-sub">18个适用于家庭龙门架/自重的候选动作。仅加入当前成员；不会自动覆盖原计划。首次进行请从轻负重开始。</p></div><span class="pill">离线可用</span></div><div class="field" style="max-width:280px;margin-bottom:12px"><label for="library-target">加入到哪个训练日</label><select id="library-target">${choices.map(x=>`<option value="${x[2]}">${esc(x[0])} · ${esc(x[1])}</option>`).join('')}</select></div><div class="library-grid">${EXT_LIBRARY.map(e=>{const added=current.some(x=>x.sourceId===e.id);return `<div class="library-entry"><div class="row"><div class="pose" style="width:69px;height:69px">${poseSvg(e.pose)}</div><div style="flex:1"><strong>${esc(e.name)}</strong><div class="muted tiny">${esc(e.muscle)} · ${esc(e.equip)}</div></div></div><p class="tiny">${esc(e.how)}</p><button class="btn slim secondary" data-library-add="${e.id}" ${added?'disabled':''}>${added?'已加入当前档案':'加入当前训练日'}</button></div>`}).join('')}</div><p class="disclaimer">资料为人工整理的保守动作说明，不是外部数据库的逐条医学审核，也没有使用未经授权的动作照片。已怀孕或有疼痛、眩晕等情况，须按医生指导调整。</p></div>`}
function addFromLibrary(id){const e=EXT_LIBRARY.find(x=>x.id===id),target=$('library-target')?.value;const p=pr();if(!e||!P[target]||!days().some(x=>x[2]===target))return tip('请选择可用训练日');p.customExercises=p.customExercises||[];if(p.customExercises.some(x=>x.sourceId===id)){tip('该动作已经加入');return}const copy={...e,id:'custom_'+id,sourceId:id,fromLibrary:true,cat:target};p.customExercises.push(copy);save();render();tip('已加入当前档案');}
function productSection(){const products=pr().foodProducts||[];return `<div class="card"><h2>包装食品专属库</h2><p class="section-sub">按实际营养标签建立你的酸奶、燕麦、面包等常购商品。输入的是每100g数值，记录时按食用克数自动换算。离线可用，夫妻食物库独立。</p><form id="product-label-form" class="formline"><div class="field" style="grid-column:span 2"><label>商品名称</label><input name="productName" maxlength="60" placeholder="如：无糖高蛋白希腊酸奶" required></div>${[['productEnergy','热量 kcal /100g'],['productProtein','蛋白质 g /100g'],['productCarbs','碳水 g /100g'],['productFat','脂肪 g /100g']].map(([k,label])=>`<div class="field"><label>${label}</label><input type="number" name="${k}" step="0.1" min="0" required></div>`).join('')}<div class="field" style="justify-content:end"><button class="btn" type="submit">保存食品标签</button></div></form>${products.length?`<div class="line"></div>${products.map((x,i)=>`<div class="listrow"><div><strong>${esc(x.name)}</strong><div class="muted micro">每100g：${fmt(x.kcal,0)}kcal · 蛋白${fmt(x.protein)}g · 碳水${fmt(x.carbs)}g · 脂肪${fmt(x.fat)}g</div><div class="row" style="margin-top:6px"><label class="micro" for="product-grams-${i}">食用克数</label><input id="product-grams-${i}" aria-label="${esc(x.name)}食用克数" type="number" min="1" max="3000" value="180" step="1" style="width:82px;padding:7px;border:1px solid #d6e0ed;border-radius:7px"><button class="btn slim secondary" data-product-add="${esc(x.id)}">加入今日</button><button class="btn slim danger" data-product-del="${esc(x.id)}">删除</button></div></div></div>`).join('')}`:'<p class="muted tiny">还没有商品，可先把常买酸奶包装背面的营养成分录入。</p>'}<p class="disclaimer">商品标签可能以每100mL标注，需按原单位换算；不要直接把100mL当成100g。不要输入身份证号等个人信息。此功能不调用外部服务器。</p></div>`}
function addFromProduct(id){const p=pr(),idx=(p.foodProducts||[]).findIndex(x=>x.id===id);if(idx<0)return;let x=p.foodProducts[idx],g=num($('product-grams-'+idx)?.value);if(g===null||g<1||g>3000)return tip('请输入1–3000g');const m=g/100;p.meals.push({id:rid(),date:today(),type:'早餐',name:x.name+' '+g+'g',kcal:+(x.kcal*m).toFixed(1),protein:+(x.protein*m).toFixed(1),carbs:+(x.carbs*m).toFixed(1),fat:+(x.fat*m).toFixed(1),estimated:false,labelBased:true});save();render();tip('按商品营养标签加入今日早餐');}
function removeProduct(id){const p=pr();if(!confirm('删除这项自建食品？已经保存的餐食记录不会删除。'))return;p.foodProducts=(p.foodProducts||[]).filter(x=>x.id!==id);save();render();}
async function persistStorage(){if(!navigator.storage?.persist){tip('此浏览器不支持持久存储申请');return}const granted=await navigator.storage.persist();tip(granted?'浏览器已同意持久存储申请':'浏览器未授予持久存储，请定期备份');}
async function storageStatus(){let data={};if(navigator.storage?.estimate){try{let e=await navigator.storage.estimate();data.bytes=e.usage||0;data.quota=e.quota||0}catch{}}let persistent=false;try{persistent=await navigator.storage?.persisted?.()}catch{}openModal(`<h2>本机存储状态</h2><p>保存方式：${esc(lastSaveStatus)}</p><p>持久存储：${persistent?'已获授权':'未获授权或不支持'}</p><p>占用约：${(data.bytes/1048576||0).toFixed(1)} MB</p><p class="disclaimer">即使获得浏览器持久存储许可，卸载应用、清除网站数据或换设备仍可能导致丢失。每周保存加密JSON备份最可靠。</p>`);}
