<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="坐姿肩推 动作循环示意"><rect width="420" height="260" rx="24" class="bg"/><path d="M36 221 H384" class="floor"/><g transform="translate(20 0)"><path class="equip" d="M100 148 V218 H224 M107 150 H185"/><path class="body" d="M160 77 V169"/><circle class="skin" cx="160" cy="51" r="16"/><path class="limb" d="M160 166 L145 191 L139 216 M160 166 L187 190 L193 216"/><path class="limb" d="M156 89 L131 113 L131 73"><animate attributeName="d" values="M156 89 L131 113 L131 73;M156 89 L133 56 L133 26;M156 89 L131 113 L131 73" dur="2.3s" repeatCount="indefinite"/></path><path class="limb" d="M165 89 L192 112 L192 73"><animate attributeName="d" values="M165 89 L192 112 L192 73;M165 89 L189 56 L189 26;M165 89 L192 112 L192 73" dur="2.3s" repeatCount="indefinite"/></path><path class="handle" d="M106 72 H218"><animate attributeName="d" values="M106 72 H218;M106 25 H218;M106 72 H218" dur="2.3s" repeatCount="indefinite"/></path></g><path class="motion" d="M345 100 A32 32 0 0 1 332 147"/><path fill="#10a898" d="M329 140 l4 15 10 -11"/><text x="310" y="41">动作循环</text><text x="23" y="247">示意动画 · 非真人动作校正</text><style> .bg{fill:#f0f6ff}.floor{stroke:#c4d5ec;stroke-width:3}.equip{stroke:#95abc5;stroke-width:7;stroke-linecap:round;fill:none}.thin{stroke:#98b2ce;stroke-width:3;fill:none}.body{stroke:#214d88;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;fill:none}.limb{stroke:#3a79d1;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none}.skin{fill:#efbd96;stroke:#c58d74;stroke-width:2}.joint{fill:#3a79d1}.handle{stroke:#132e54;stroke-width:6;stroke-linecap:round;fill:none}.motion{stroke:#10a898;stroke-width:4;fill:none;stroke-dasharray:5 6}text{font-family:system-ui,'Noto Sans SC',sans-serif;fill:#406285;font-size:13px;font-weight:700}@media(prefers-reduced-motion:reduce){.anim{display:none}} </style></svg>