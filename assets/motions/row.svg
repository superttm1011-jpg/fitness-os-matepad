<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="坐姿划船 动作循环示意"><rect width="420" height="260" rx="24" class="bg"/><path d="M36 221 H384" class="floor"/><g transform="translate(20 0)"><path class="equip" d="M45 44 V215 M51 198 H280 M113 177 H204"/><path class="body" d="M157 88 L151 164"/><circle class="skin" cx="159" cy="65" r="16"/><path class="limb" d="M151 164 L193 170 L223 210"/><path class="limb" d="M153 164 L130 188 L133 210"/><path class="limb" d="M155 100 L205 118 L249 117"><animate attributeName="d" values="M155 100 L205 118 L249 117;M155 100 L193 122 L183 141;M155 100 L205 118 L249 117" dur="2.4s" repeatCount="indefinite"/></path><path class="handle" d="M247 104 V132"><animate attributeName="d" values="M247 104 V132;M183 126 V153;M247 104 V132" dur="2.4s" repeatCount="indefinite"/></path><path class="thin" d="M280 32 V190 M280 118 L247 118"/></g><path class="motion" d="M345 100 A32 32 0 0 1 332 147"/><path fill="#10a898" d="M329 140 l4 15 10 -11"/><text x="310" y="41">动作循环</text><text x="23" y="247">示意动画 · 非真人动作校正</text><style> .bg{fill:#f0f6ff}.floor{stroke:#c4d5ec;stroke-width:3}.equip{stroke:#95abc5;stroke-width:7;stroke-linecap:round;fill:none}.thin{stroke:#98b2ce;stroke-width:3;fill:none}.body{stroke:#214d88;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;fill:none}.limb{stroke:#3a79d1;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none}.skin{fill:#efbd96;stroke:#c58d74;stroke-width:2}.joint{fill:#3a79d1}.handle{stroke:#132e54;stroke-width:6;stroke-linecap:round;fill:none}.motion{stroke:#10a898;stroke-width:4;fill:none;stroke-dasharray:5 6}text{font-family:system-ui,'Noto Sans SC',sans-serif;fill:#406285;font-size:13px;font-weight:700}@media(prefers-reduced-motion:reduce){.anim{display:none}} </style></svg>