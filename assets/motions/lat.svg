<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="高位下拉 动作循环示意"><rect width="420" height="260" rx="24" class="bg"/><path d="M36 221 H384" class="floor"/><g transform="translate(20 0)"><path class="equip" d="M76 30 V217 M255 30 V217 M76 31 H255 M116 184 H218"/><path class="body" d="M166 85 V166"/><circle class="skin" cx="165" cy="61" r="16"/><path class="limb" d="M163 166 L148 191 L139 215 M166 166 L184 191 L195 215"/><path class="limb" d="M159 90 L119 66 L106 39"><animate attributeName="d" values="M159 90 L119 66 L106 39;M159 90 L120 117 L108 102;M159 90 L119 66 L106 39" dur="2.8s" repeatCount="indefinite"/></path><path class="limb" d="M171 90 L212 66 L225 39"><animate attributeName="d" values="M171 90 L212 66 L225 39;M171 90 L211 117 L222 102;M171 90 L212 66 L225 39" dur="2.8s" repeatCount="indefinite"/></path><path class="handle" d="M103 38 H228"><animate attributeName="d" values="M103 38 H228;M103 103 H228;M103 38 H228" dur="2.8s" repeatCount="indefinite"/></path></g><path class="motion" d="M345 100 A32 32 0 0 1 332 147"/><path fill="#10a898" d="M329 140 l4 15 10 -11"/><text x="310" y="41">动作循环</text><text x="23" y="247">示意动画 · 非真人动作校正</text><style> .bg{fill:#f0f6ff}.floor{stroke:#c4d5ec;stroke-width:3}.equip{stroke:#95abc5;stroke-width:7;stroke-linecap:round;fill:none}.thin{stroke:#98b2ce;stroke-width:3;fill:none}.body{stroke:#214d88;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;fill:none}.limb{stroke:#3a79d1;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none}.skin{fill:#efbd96;stroke:#c58d74;stroke-width:2}.joint{fill:#3a79d1}.handle{stroke:#132e54;stroke-width:6;stroke-linecap:round;fill:none}.motion{stroke:#10a898;stroke-width:4;fill:none;stroke-dasharray:5 6}text{font-family:system-ui,'Noto Sans SC',sans-serif;fill:#406285;font-size:13px;font-weight:700}@media(prefers-reduced-motion:reduce){.anim{display:none}} </style></svg>