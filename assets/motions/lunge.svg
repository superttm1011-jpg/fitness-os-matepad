<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="箭步蹲 动作循环示意"><rect width="420" height="260" rx="24" class="bg"/><path d="M36 221 H384" class="floor"/><g transform="translate(20 0)"><path class="body" d="M157 82 V155"><animate attributeName="d" values="M157 82 V155;M157 109 V182;M157 82 V155" dur="2.8s" repeatCount="indefinite"/></path><circle class="skin" cx="157" cy="58" r="16"><animate attributeName="cy" values="58;85;58" dur="2.8s" repeatCount="indefinite"/></circle><path class="limb" d="M157 156 L112 179 L94 216"><animate attributeName="d" values="M157 156 L112 179 L94 216;M157 183 L111 186 L94 216;M157 156 L112 179 L94 216" dur="2.8s" repeatCount="indefinite"/></path><path class="limb" d="M157 156 L210 174 L236 214"><animate attributeName="d" values="M157 156 L210 174 L236 214;M157 183 L209 186 L236 214;M157 156 L210 174 L236 214" dur="2.8s" repeatCount="indefinite"/></path><path class="limb" d="M157 91 L143 132 L142 165"/></g><path class="motion" d="M345 100 A32 32 0 0 1 332 147"/><path fill="#10a898" d="M329 140 l4 15 10 -11"/><text x="310" y="41">动作循环</text><text x="23" y="247">示意动画 · 非真人动作校正</text><style> .bg{fill:#f0f6ff}.floor{stroke:#c4d5ec;stroke-width:3}.equip{stroke:#95abc5;stroke-width:7;stroke-linecap:round;fill:none}.thin{stroke:#98b2ce;stroke-width:3;fill:none}.body{stroke:#214d88;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;fill:none}.limb{stroke:#3a79d1;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none}.skin{fill:#efbd96;stroke:#c58d74;stroke-width:2}.joint{fill:#3a79d1}.handle{stroke:#132e54;stroke-width:6;stroke-linecap:round;fill:none}.motion{stroke:#10a898;stroke-width:4;fill:none;stroke-dasharray:5 6}text{font-family:system-ui,'Noto Sans SC',sans-serif;fill:#406285;font-size:13px;font-weight:700}@media(prefers-reduced-motion:reduce){.anim{display:none}} </style></svg>