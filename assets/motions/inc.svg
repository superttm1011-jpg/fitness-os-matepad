<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="上斜卧推 动作循环示意"><rect width="420" height="260" rx="24" class="bg"/><path d="M36 221 H384" class="floor"/><g transform="translate(20 0)"><path class="equip" d="M45 183 H281 M78 184 V210 M259 184 V210 M70 168 H276"/><path class="body" d="M127 166 L227 169"/><circle class="skin" cx="112" cy="158" r="14"/><path class="limb" d="M218 170 L242 192 L265 210"/><path class="limb" d="M164 164 L178 135 L185 118"><animate attributeName="d" values="M164 164 L178 135 L185 118;M164 164 L167 124 L185 76;M164 164 L178 135 L185 118" dur="2.5s" repeatCount="indefinite"/></path><path class="handle" d="M111 118 H269"><animate attributeName="d" values="M111 118 H269;M111 76 H269;M111 118 H269" dur="2.5s" repeatCount="indefinite"/></path><path class="thin" d="M101 60 H278 M104 45 V216 M276 45 V216"/></g><path class="motion" d="M345 100 A32 32 0 0 1 332 147"/><path fill="#10a898" d="M329 140 l4 15 10 -11"/><text x="310" y="41">动作循环</text><text x="23" y="247">示意动画 · 非真人动作校正</text><style> .bg{fill:#f0f6ff}.floor{stroke:#c4d5ec;stroke-width:3}.equip{stroke:#95abc5;stroke-width:7;stroke-linecap:round;fill:none}.thin{stroke:#98b2ce;stroke-width:3;fill:none}.body{stroke:#214d88;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;fill:none}.limb{stroke:#3a79d1;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none}.skin{fill:#efbd96;stroke:#c58d74;stroke-width:2}.joint{fill:#3a79d1}.handle{stroke:#132e54;stroke-width:6;stroke-linecap:round;fill:none}.motion{stroke:#10a898;stroke-width:4;fill:none;stroke-dasharray:5 6}text{font-family:system-ui,'Noto Sans SC',sans-serif;fill:#406285;font-size:13px;font-weight:700}@media(prefers-reduced-motion:reduce){.anim{display:none}} </style></svg>