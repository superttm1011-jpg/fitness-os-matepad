<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="绳索下压 动作循环示意"><rect width="420" height="260" rx="24" class="bg"/><path d="M36 221 H384" class="floor"/><g transform="translate(20 0)"><path class="equip" d="M259 31 V218 M256 38 H222"/><path class="body" d="M164 85 V165"/><circle class="skin" cx="164" cy="60" r="16"/><path class="limb" d="M164 165 L143 191 L140 215 M164 165 L187 192 L193 215"/><path class="limb" d="M170 95 L191 124 L187 136"><animate attributeName="d" values="M170 95 L191 124 L187 136;M170 95 L191 124 L186 181;M170 95 L191 124 L187 136" dur="2.5s" repeatCount="indefinite"/></path><path class="handle" d="M172 132 H202"><animate attributeName="d" values="M172 132 H202;M172 181 H202;M172 132 H202" dur="2.5s" repeatCount="indefinite"/></path><path class="thin" d="M259 39 L188 132"/></g><path class="motion" d="M345 100 A32 32 0 0 1 332 147"/><path fill="#10a898" d="M329 140 l4 15 10 -11"/><text x="310" y="41">动作循环</text><text x="23" y="247">示意动画 · 非真人动作校正</text><style> .bg{fill:#f0f6ff}.floor{stroke:#c4d5ec;stroke-width:3}.equip{stroke:#95abc5;stroke-width:7;stroke-linecap:round;fill:none}.thin{stroke:#98b2ce;stroke-width:3;fill:none}.body{stroke:#214d88;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;fill:none}.limb{stroke:#3a79d1;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none}.skin{fill:#efbd96;stroke:#c58d74;stroke-width:2}.joint{fill:#3a79d1}.handle{stroke:#132e54;stroke-width:6;stroke-linecap:round;fill:none}.motion{stroke:#10a898;stroke-width:4;fill:none;stroke-dasharray:5 6}text{font-family:system-ui,'Noto Sans SC',sans-serif;fill:#406285;font-size:13px;font-weight:700}@media(prefers-reduced-motion:reduce){.anim{display:none}} </style></svg>